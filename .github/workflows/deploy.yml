name: Deploy to VPS

on:
  push:
    branches:
      - Donald-Commerce-System

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/commerce-system
            git pull origin Donald-Commerce-System
            npm install
            npm run build
            pm2 restart commerce-system