services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      NODE_ENV: production
    # Exposed via Dokploy: create a Domain in the dashboard pointing at this
    # service on internal port 3000 — Dokploy's Traefik proxy listens on 80/443
    # and forwards to it, so no host port is published here.
    expose:
      - "3000"
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    # Pulled from Amazon ECR Public's mirror of the official image, since
    # anonymous docker.io pulls from a VPS can hit Docker Hub's rate limit (429).
    image: public.ecr.aws/docker/library/mysql:8.4
    restart: unless-stopped
    # The migration history mixes table name casing (e.g. `Product`/`product`).
    # Linux MySQL is case-sensitive by default, so this keeps table lookups
    # case-insensitive to match how the migrations were authored.
    command: ["--lower-case-table-names=1"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  uploads:
